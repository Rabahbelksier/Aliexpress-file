kind = "mobile"
previewPath = "/"
title = "AliExpress File App"
version = "1.0.0"
id = "artifacts/aliexpress-app"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 21747

[services.development]
run = "pnpm --filter @workspace/aliexpress-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/aliexpress-app", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/aliexpress-app", "run", "serve" ]

[services.env]
PORT = "21747"
BASE_PATH = "/"
